name: Release

# Publishing a GitHub release builds the packages and attaches them to it. A pull request or a
# push to a claude/** branch that changes this workflow or the smoke test, or a manual run, builds
# them as workflow artifacts instead, without a release.
#
# Every package is full: the library with both backends, its headers and CMake package, the
# GraalVM native image and the jar.
#   Linux    one per GCC version (8, 11, 13) and C++ standard (17: std::optional; 11:
#            boost::optional, for C++11/14 consumers), each built in the distribution whose
#            system compiler is that GCC;
#   macOS    one per C++ standard, on the latest macOS (arm64);
#   Windows  C++17 (MSVC has no C++11 mode).
#
# A release takes its version from its tag (v1.2.0 or 1.2.0: 1.2.0): the package names, the jar and
# the CMake package carry it. Otherwise the version is the revision of java/pom.xml.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/release-smoke-test/**'
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/release.yml'
      - '.github/release-smoke-test/**'
  workflow_dispatch:

jobs:
  version:
    name: Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version of the release, or of java/pom.xml
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            version="${TAG#v}"
          else
            version=$(sed -n 's:.*<revision>\([^<]*\)</revision>.*:\1:p' java/pom.xml | head -1)
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a version: a release tag is vX.Y.Z or X.Y.Z, as v1.2.0 or v1.2.0-rc1"
            exit 1
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ── Jar and Linux native image ─────────────────────────────────────────────
  # Neither depends on the C++ compiler: built once, and put in every Linux package. Built on
  # Rocky Linux 8 (glibc 2.28), the native image loads on every distribution the packages target.
  # No GraalVM installed: CMake downloads it for native-image.
  java-native:
    name: Jar and Linux native image
    needs: version
    runs-on: ubuntu-22.04
    container: rockylinux:8
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      JAR: iidm-bridge-java-${{ needs.version.outputs.version }}-fat.jar

    steps:
      - name: Install the build tools
        run: dnf install -y gcc gcc-c++ make cmake glibc-devel zlib-devel git tar gzip findutils binutils

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Maven
        run: |
          curl -sSfL https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz | tar -xz -C /opt
          echo /opt/apache-maven-3.9.9/bin >> "$GITHUB_PATH"

      - name: Build the jar and the native image
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DIIDM_BRIDGE_VERSION="$VERSION" \
                -DIIDM_BRIDGE_ENABLE_JNI=OFF -DIIDM_BRIDGE_BUILD_EXAMPLES=OFF
          cmake --build build --target iidmbridge_native

      - name: Check that the native image needs glibc 2.28 at most
        run: |
          newest=$(objdump -T build/graalvm-native/libpowsybl-iidm-native.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Newest glibc symbol version: $newest"
          [ "$(printf '%s\n' "$newest" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28 ]

      - name: Upload the jar and the native image
        run: |
          mkdir dist
          cp "java/target/$JAR" build/graalvm-native/libpowsybl-iidm-native.so dist/

      - uses: actions/upload-artifact@v7
        with:
          name: java-native
          path: dist/
          if-no-files-found: error

      - name: Attach the jar to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ env.JAR }}

  # ── Linux packages ─────────────────────────────────────────────────────────
  # A package needs at least the glibc of the distribution it is built in: GCC 8 on Rocky Linux 8
  # (glibc 2.28: RHEL 8, Dynawo's Fedora 29 image), GCC 11 on Rocky Linux 9 (glibc 2.34: RHEL 9,
  # Ubuntu 22.04), GCC 13 on Ubuntu 24.04 (glibc 2.39).
  linux:
    name: Linux package (GCC ${{ matrix.gcc }}, C++${{ matrix.std }})
    needs: [version, java-native]
    runs-on: ubuntu-22.04
    container: ${{ matrix.image }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        gcc: ['8', '11', '13']
        std: ['17', '11']
        include:
          - gcc: '8'
            image: rockylinux:8
          - gcc: '11'
            image: rockylinux:9
          - gcc: '13'
            image: ubuntu:24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      JAR: iidm-bridge-java-${{ needs.version.outputs.version }}-fat.jar
      PACKAGE: iidm-bridge-${{ needs.version.outputs.version }}-linux-x86_64-gcc${{ matrix.gcc }}-cxx${{ matrix.std }}

    steps:
      - name: Install the build tools (Rocky Linux)
        if: startsWith(matrix.image, 'rockylinux')
        run: dnf install -y gcc-c++ make cmake boost-devel git tar gzip findutils

      - name: Install the build tools (Ubuntu)
        if: startsWith(matrix.image, 'ubuntu')
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++ make cmake libboost-dev git ca-certificates

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download the jar and the native image
        uses: actions/download-artifact@v8
        with:
          name: java-native
          path: prebuilt

      - name: Build
        run: |
          g++ --version | head -1
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
                -DIIDM_BRIDGE_VERSION="$VERSION" -DIIDM_BRIDGE_BUILD_JAVA=OFF -DIIDM_BRIDGE_BUILD_NATIVE=OFF \
                -DIIDM_BRIDGE_BUILD_TESTS=ON -DIIDM_BRIDGE_BUILD_EXAMPLES=OFF \
                -DCMAKE_INSTALL_PREFIX="$PWD/$PACKAGE" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build --parallel 4

      - name: Test on both backends
        run: |
          export IIDM_BRIDGE_JAR="$PWD/prebuilt/$JAR"
          export IIDM_BRIDGE_GRAALVM_LIB="$PWD/prebuilt/libpowsybl-iidm-native.so"
          export IIDM_IEEE14_NETWORK_PATH="$PWD/examples/IEEE14.xiidm"
          ctest --test-dir build --output-on-failure --parallel 4

      - name: Package
        run: |
          cmake --install build
          cp prebuilt/libpowsybl-iidm-native.so "$PACKAGE/lib/"
          mkdir -p "$PACKAGE/share/iidm-bridge"
          cp "prebuilt/$JAR" LICENSE.txt "$PACKAGE/share/iidm-bridge/"
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"

      - name: Smoke test the package
        run: |
          mkdir smoke
          tar -xzf "$PACKAGE.tar.gz" -C smoke
          cmake -S .github/release-smoke-test -B smoke/build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_STANDARD=${{ matrix.std }} -DCMAKE_PREFIX_PATH="$PWD/smoke/$PACKAGE" \
                -DIIDM_BRIDGE_VERSION="${VERSION%%[-+]*}"
          cmake --build smoke/build
          LD_LIBRARY_PATH="$PWD/smoke/$PACKAGE/lib" ./smoke/build/smoke_test examples/IEEE14.xiidm \
              "$PWD/smoke/$PACKAGE/share/iidm-bridge/$JAR"

      - name: Attach the package to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.PACKAGE }}.tar.gz

      - name: Upload the package
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.tar.gz
          retention-days: 7

  # ── macOS packages ─────────────────────────────────────────────────────────
  macos:
    name: macOS package (C++${{ matrix.std }})
    needs: version
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        std: ['17', '11']
    env:
      VERSION: ${{ needs.version.outputs.version }}
      JAR: iidm-bridge-java-${{ needs.version.outputs.version }}-fat.jar
      PACKAGE: iidm-bridge-${{ needs.version.outputs.version }}-macos-arm64-cxx${{ matrix.std }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up GraalVM CE 21 with native-image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the build tools
        run: brew install cmake ninja boost

      - name: Build the jar, the native image and the library
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
                -DIIDM_BRIDGE_VERSION="$VERSION" -DIIDM_BRIDGE_BUILD_TESTS=ON -DIIDM_BRIDGE_BUILD_EXAMPLES=OFF \
                -DCMAKE_INSTALL_PREFIX="$PWD/$PACKAGE" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build --parallel

      - name: Test on both backends
        run: |
          export DYLD_LIBRARY_PATH="$PWD/build/graalvm-native"
          export IIDM_BRIDGE_JAR="$PWD/java/target/$JAR"
          export IIDM_BRIDGE_GRAALVM_LIB="$PWD/build/graalvm-native/libpowsybl-iidm-native.dylib"
          export IIDM_IEEE14_NETWORK_PATH="$PWD/examples/IEEE14.xiidm"
          ctest --test-dir build --output-on-failure --parallel 4

      - name: Package
        run: |
          cmake --install build
          cp LICENSE.txt "$PACKAGE/share/iidm-bridge/"
          tar -czf "$PACKAGE.tar.gz" "$PACKAGE"

      - name: Smoke test the package
        run: |
          mkdir smoke
          tar -xzf "$PACKAGE.tar.gz" -C smoke
          cmake -S .github/release-smoke-test -B smoke/build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_STANDARD=${{ matrix.std }} -DCMAKE_PREFIX_PATH="$PWD/smoke/$PACKAGE" \
                -DIIDM_BRIDGE_VERSION="${VERSION%%[-+]*}"
          cmake --build smoke/build
          export DYLD_LIBRARY_PATH="$PWD/smoke/$PACKAGE/lib"
          ./smoke/build/smoke_test examples/IEEE14.xiidm "$PWD/smoke/$PACKAGE/share/iidm-bridge/$JAR"

      - name: Attach the package to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.PACKAGE }}.tar.gz

      - name: Upload the package
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.tar.gz
          retention-days: 7

  # ── Windows package ────────────────────────────────────────────────────────
  windows:
    name: Windows package (C++17)
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      JAR: iidm-bridge-java-${{ needs.version.outputs.version }}-fat.jar
      PACKAGE: iidm-bridge-${{ needs.version.outputs.version }}-windows-x86_64-cxx17

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up GraalVM CE 21 with native-image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The tests and the smoke test start a JVM: jvm.dll must be on the PATH
      - name: Add the JVM server directory to the PATH
        shell: bash
        run: echo "$JAVA_HOME/bin/server" >> "$GITHUB_PATH"

      # cl.exe and link.exe for CMake, and for native-image
      - name: Set up the MSVC environment
        uses: ./.github/actions/msvc-dev-env

      - name: Build the jar, the native image and the library
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DIIDM_BRIDGE_VERSION="$VERSION" \
                -DIIDM_BRIDGE_BUILD_TESTS=ON -DIIDM_BRIDGE_BUILD_EXAMPLES=OFF \
                -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$PWD/$PACKAGE")"
          cmake --build build --parallel

      - name: Test on both backends
        shell: bash
        run: |
          export PATH="$PWD/build/graalvm-native:$PATH"
          export IIDM_BRIDGE_JAR="$(cygpath -w "$PWD/java/target/$JAR")"
          export IIDM_BRIDGE_GRAALVM_LIB="$(cygpath -w "$PWD/build/graalvm-native/libpowsybl-iidm-native.dll")"
          export IIDM_IEEE14_NETWORK_PATH="$(cygpath -w "$PWD/examples/IEEE14.xiidm")"
          ctest --test-dir build --output-on-failure --parallel 4

      - name: Package
        shell: bash
        run: |
          cmake --install build
          cp LICENSE.txt "$PACKAGE/share/iidm-bridge/"
          7z a -tzip "$PACKAGE.zip" "$PACKAGE" > /dev/null

      - name: Smoke test the package
        shell: bash
        run: |
          mkdir smoke
          7z x -osmoke "$PACKAGE.zip" > /dev/null
          # The consumer compiles in the package's standard: MSVC's default is C++14
          cmake -S .github/release-smoke-test -B smoke/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_STANDARD=17 -DCMAKE_PREFIX_PATH="$(cygpath -w "$PWD/smoke/$PACKAGE")" \
                -DIIDM_BRIDGE_VERSION="${VERSION%%[-+]*}"
          cmake --build smoke/build
          export PATH="$PWD/smoke/$PACKAGE/bin:$PATH"
          ./smoke/build/smoke_test.exe examples/IEEE14.xiidm \
              "$(cygpath -w "$PWD/smoke/$PACKAGE/share/iidm-bridge/$JAR")"

      - name: Attach the package to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.PACKAGE }}.zip

      - name: Upload the package
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip
          retention-days: 7
